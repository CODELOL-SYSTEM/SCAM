<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Immersif</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050308;color:#f3e3b0;font-family:Segoe UI,Tahoma,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{cursor:pointer;background:#2b1a4a;color:#f3e3b0;border:1px solid #d4af37;border-radius:8px;padding:6px 12px;font:inherit}
button:hover{background:#3d2570}button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#1a1228;color:#fff;border:1px solid #6b4fb0;border-radius:6px;padding:5px 8px;font:inherit}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#120a1e;border:1px solid #d4af37;border-radius:10px;padding:10px 16px;z-index:60;display:none;max-width:80%;text-align:center}
#tut{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#120a1ecc;border:1px solid #d4af37;border-radius:10px;padding:10px 16px;z-index:8;max-width:70%;display:none;text-align:center}
#arrow{position:fixed;z-index:7;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #ffd54a;border-radius:50%;box-shadow:0 0 24px #ffd54a;animation:pl 1s infinite;pointer-events:none;display:none}
@keyframes pl{50%{transform:scale(1.3);opacity:.5}}
/* le PC : la fenêtre est repositionnée par app.js pile sur l'écran 3D */
#pn{position:fixed;left:0;top:0;width:1000px;height:560px;background:#0b1530;z-index:10;display:none;overflow:hidden}
#x{position:fixed;right:16px;top:12px;z-index:11;display:none}
#boot,#msg{position:fixed;inset:0;background:#000;z-index:40;display:none;align-items:center;justify-content:center;color:#fff;font-size:28px;text-align:center}
#boot::before{content:"";width:46px;height:46px;border:5px solid #333;border-top-color:#4cc2ff;border-radius:50%;animation:sp 1s linear infinite;margin-right:18px}
@keyframes sp{to{transform:rotate(360deg)}}
#ring{position:fixed;right:20px;top:80px;z-index:30;background:#120a1e;border:2px solid #4be07a;border-radius:12px;padding:14px;text-align:center;display:none}
#call{position:fixed;inset:6% 12%;z-index:31;background:#120a1ef5;border:2px solid #d4af37;border-radius:14px;padding:14px;display:none;flex-direction:column}
.g{background:#1d7a2b}.r{background:#a02020}.gg{background:#fff;color:#222}
.pt{display:inline-block;width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #d4af37;flex:none}
.pt svg{width:100%;height:100%;display:block}
.talk .mo{animation:mo .18s infinite alternate}@keyframes mo{to{ry:6}}
.bar{width:160px;height:10px;background:#2b2140;border-radius:5px;overflow:hidden;margin:6px auto}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7b2fff,#d4af37)}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:1px solid #fff2}
.cen{padding:20px;text-align:center}
.hl{outline:3px solid #ffd54a;animation:pl 1s infinite}
.dk{position:relative;overflow:hidden;color:#fff;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:10px;width:100%}
.ic{width:84px;text-align:center;padding:8px 4px;cursor:pointer;font-size:12px;text-shadow:0 1px 3px #000}
.ic b{display:block;font-size:32px}
.win{position:absolute;left:110px;top:16px;right:16px;bottom:62px;padding:10px;overflow:auto;color:#111}
.win button{color:#111}.win input,.win textarea{background:#fff;color:#111;border-color:#aaa}
.menu{position:absolute;padding:10px;z-index:5}.menu div{padding:8px;cursor:pointer}
.tb{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:0 10px}
.tb .st{cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg width="0" height="0" style="position:absolute"><filter id="pc"><feColorMatrix type="saturate" values="1.15"/></filter></svg>
<div id="arrow"></div>
<div id="tut"></div>
<div id="toast"></div>
<div id="pn"></div>
<button id="x">✕ Retour</button>
<div id="boot">Démarrage de Windows…</div>
<div id="msg"></div>
<div id="ring"></div>
<div id="call"></div>
<script type="module" src="app.js"></script>
</body>
</html>
